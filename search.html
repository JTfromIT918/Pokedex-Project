<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap CSS-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

         <!-- Custom CSS-->
        <link rel="stylesheet" href="css/styles.css">

        <title>Pokédex | Search</title>
    </head>

    <body>
        <header>
            <nav class="navbar navbar-expand-lg">

                <div class="container">

                    <a class="navbar-brand" href="index.html">Pokédex</a>

                    <button class="navbar-toggler"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#pokemonNavbar"
                            aria-controls="pokemonNavbar"
                            aria-expanded="false"
                            aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="pokemonNavbar">

                        <ul class="navbar-nav">

                          <li class="nav-item">

                            <a class="nav-link" href="index.html">Home</a>

                          </li>

                          <li class="nav-item">

                            <a class="nav-link active" aria-current="page" href="search.html">Search</a>
                            

                          </li>
                          <li class="nav-item">

                            <a class="nav-link" href="database.html">Database</a>

                          </li>

                        </ul>

                    </div>

                

                </div>

            </nav>

        </header>

        <main class="container py-5">

            <h1>Search Pokémon</h1>

            <section class="mt-4 p-4 bg-body-tertiary rounded-3">

                <h2>Find a Pokémon</h2>

                <form id="pokemonSearchForm">

                    <div class="input-group">
                        <input type="search"
                               class="form-control"
                               id="pokemonSearchInput"
                               placeholder="Enter Pokémon name or number"
                               aria-label="Pokémon name or number">

                        <button class="btn btn-primary"
                            type="submit">
                        
                        Search

                        </button>



                    </div>

                </form>

            </section>

            <section class="mt-5">

                <h2>Search Results</h2>

                <div class="row"
                     id="searchResult">

                     
                    
                </div>

            </section>


        </main>

        <div class="modal fade"
             id="pokemonModal"
             tabindex="-1"
             aria-labelledby="pokemonModalLabel"
             aria-hidden="true">

             <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header">

                        <h2 class="modal-title"
                            id="pokemonModalLabel">
                        Pokémon Details
                        </h2>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Close">
                        </button>

                    
                    </div>

                    <div class="modal-body">

                        <ul class="nav nav-tabs"
                            role="tablist">

                            <li class="nav-item"
                                role="presentation">

                                <button class="nav-link active"
                                        id="overview-tab"
                                        data-bs-toggle="tab"
                                        data-bs-target="#overview-pane"
                                        type="button"
                                        role="tab"
                                        aria-controls="overview-pane"
                                        aria-selected="true">
                                        
                                    Overview     

                                </button>
                            
                            </li>

                            <li class="nav-item"
                                role="presentation">

                                <button class="nav-link"
                                        id="stats-tab"
                                        data-bs-toggle="tab"
                                        data-bs-target="#stats-pane"
                                        type="button"
                                        role="tab"
                                        aria-controls="stats-pane"
                                        aria-selected="false">
                                    
                                    Stats
                                
                                </button>
                            
                            </li>

                            <li class="nav-item"
                                role="presentation">

                                <button class="nav-link"
                                        id="abilities-tab"
                                        data-bs-toggle="tab"
                                        data-bs-target="#abilities-pane"
                                        type="button"
                                        role="tab"
                                        aria-controls="abilities-pane"
                                        aria-selected="false">
                                    Abilities
                                
                                </button>
                            
                                 </li>
                        
                        </ul>

                        <div class="tab-content">

                            <div class="tab-pane fade show active"
                                 id="overview-pane"
                                 role="tabpanel"
                                 aria-labelledby="overview-tab"
                                 tabindex="0">
                                 <p>
                                Overview information will appear here. 
                                 </p>

                            </div>

                            <div class="tab-pane fade"
                                 id="stats-pane"
                                 role="tabpanel"
                                 aria-labelledby="stats-tab"
                                 tabindex="0">

                                <p>
                                    Stats information will appear here.
                                </p>
                            
                            </div>

                            <div class="tab-pane fade"
                                 id="abilities-pane"
                                 role="tabpanel"
                                 aria-labelledby="abilities-tab"
                                 tabindex="0">
                                
                                <p>
                                    Abilities information will appear here.
                                </p>
                            
                            </div>

                        </div>


                    </div>


                </div>

             </div>
            
            </div>




        <footer>Footer</footer>

        <!--Bootstrap JavaScript-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <!-- Custom JavaScript-->
        <script src="js/scripts.js"></script>
    </body>
</html>
