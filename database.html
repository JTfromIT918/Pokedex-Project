        <header>
            <nav class="navbar navbar-expand-lg">

                <div class="container">

                    <a class="navbar-brand" href="index.html">Pokédex</a>

                    <button class="navbar-toggler"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#pokemonNavbar"

                            aria-expanded="false"

                    <div class="collapse navbar-collapse" id="pokemonNavbar">

                          <li class="nav-item">

                            <a class="nav-link" href="index.html">Home</a>

                          </li>

                          </li>
                          <li class="nav-item">

                            <a class="nav-link active" aria-current="page" href="database.html">Database</a>

                          </li>

                        </ul>

                    </div>

                

                </div>

            </nav>

        <main class="container mt-4">

            <section class="mt-4">

                <div class="dropdown">

                    <button class="btn btn-secondary dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">
                        
                        Show 25 Pokémon
                    
                    </button>

                    <ul class="dropdown-menu">

                        <li>
                            
                            <button class="dropdown-item"
                                    type="button">
                                
                                25 Pokémon
                            
                            </button>

                        </li>

                        <li> 

                            <button class="dropdown-item"
                                    type="button">
                                
                                50 Pokémon
                            
                            </button>

                        </li>

                    </ul>


                </div>

                <div class="row mt-4 g-3"
                     id="pokemonGrid">

                     <div class="col-12 col-md-6 col-lg-4">

                        <div class="card">

                            <div class="card-body">

                                <p>#001</p>
                                <h3 class="card-title">Bulbasaur</h3>
                                <p class="card-text">Grass / Poison</p>
                                <button class="btn btn-primary"
                                        type="button">View Details 
                                    
                                    </button>



                            </div>

                        </div>


                     </div>

                     <div class="col-12 col-md-6 col-lg-4">

                        <div class="card">

                            <div class="card-body">

                                <p>#004</p>
                                <h3 class="card-title">Charmander</h3>

                                        type="button">View Details 
                                    
                                    </button>



                            </div>

                        </div>


                     </div>

                     <div class="col-12 col-md-6 col-lg-4">

                        <div class="card">

                            <div class="card-body">

                                <p>#007</p>
                                <h3 class="card-title">Squirtle</h3>
                                <p class="card-text">Water</p>
                                <button class="btn btn-primary"
                                        type="button">View Details 
                                    
                                    </button>



                            </div>

                        </div>


                     </div>
                    
                </div>

                <nav class="mt-4"
                     aria-label="Pokémon database pages">

                        <li class="page-item disabled">

                            <button class="page-link"
